[project]
name = "bluerov-website"
version = "0.1.0"
description = "Documentation site for the BlueROV ROS 2 + Gazebo workspace."
requires-python = ">=3.10"
dependencies = [
    "zensical>=0.1.0",
    # Zensical is mkdocs-compatible. mkdocs-material is listed as a fallback so
    # `mkdocs serve` works even if a contributor hasn't installed zensical yet.
    "mkdocs-material>=9.5",
]
