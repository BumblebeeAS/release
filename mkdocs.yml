site_name: BumblebeeAS Docs
site_description: Documentation for BumblebeeAS's public software stack.
site_url: https://bumblebeeas.github.io/release/
repo_url: https://github.com/BumblebeeAS/release
repo_name: BumblebeeAS/release
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true
      draggable: true
      skip_classes:
        - no-lightbox

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/solid/globe
      link: https://bumblebee.sg
      name: Main Website
    - icon: fontawesome/brands/github
      link: https://github.com/BumblebeeAS
      name: GitHub Organization
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/nus-bbas/
      name: LinkedIn
    - icon: fontawesome/brands/instagram
      link: https://www.instagram.com/nus_bbas/
      name: Instagram
    - icon: fontawesome/brands/youtube
      link: https://www.youtube.com/@Bbauv
      name: YouTube
    - icon: fontawesome/solid/envelope
      link: mailto:hello@bumblebee.sg
      name: Email Us
    - icon: fontawesome/brands/hugging-face
      link: https://huggingface.co/BumblebeeAS
      name: Hugging Face

nav:
  - Overview: index.md
  - Software Stack: stack.md
  - RoboSub 2025: robosub25.md
